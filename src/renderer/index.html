<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: file: https:; media-src 'self' blob: file:; style-src 'self'; script-src 'self'">
  <title>品味大战</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar control-surface">
      <div class="brand-block">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <div>
          <h1>品味大战</h1>
          <p>TASTE ARENA · LIVE</p>
        </div>
      </div>

      <button id="importButton" class="primary-button wide-button" type="button">
        <span class="button-icon">＋</span> 导入音频 / 视频
      </button>
      <div class="playlist-actions">
        <button id="openPlaylistButton" class="ghost-button" type="button">导入歌单</button>
        <button id="savePlaylistButton" class="ghost-button" type="button" disabled>保存歌单</button>
      </div>
      <button id="editTrackButton" class="ghost-button wide-button edit-track-button" type="button" disabled>编辑当前曲目信息</button>
      <button id="backstageButton" class="ghost-button wide-button edit-track-button" type="button">打开直播后台</button>
      <label class="audio-engine-control control-surface">音频播放器
        <select id="audioEngineSelect" aria-label="音频播放器">
          <option value="builtin">内置播放器</option>
          <option value="foobar" selected>foobar2000</option>
        </select>
      </label>

      <div class="section-heading">
        <span>播放队列</span>
        <span id="trackCount" class="count-badge">0 首</span>
      </div>
      <div id="playlist" class="playlist empty">
        <div class="empty-playlist">
          <div class="drop-icon">⇩</div>
          <strong>把媒体文件拖到这里</strong>
          <span>支持 MP3 / FLAC / WAV / MP4 / WEBM</span>
        </div>
      </div>

    </aside>

    <main class="workspace">
      <header class="topbar control-surface">
        <div>
          <span class="eyebrow">PROGRAM OUTPUT</span>
          <strong>直播节目画面</strong>
        </div>
        <div class="top-actions">
          <button id="exportButton" class="ghost-button" type="button">导出播放记录</button>
          <button id="programModeButton" class="primary-button" type="button">进入节目模式</button>
        </div>
      </header>

      <section id="programFrame" class="program-frame no-media">
        <div class="cover-ambient" aria-hidden="true"><img id="coverBackdropImage" alt=""></div>
        <video id="mediaElement" class="stage-video" playsinline></video>

        <div class="program-content">
          <div class="stage-main">
            <section class="track-zone">
              <div class="track-pill">TRACK <span id="trackNumber">--</span></div>
              <div id="coverFrame" class="cover-frame">
                <div id="coverFallback" class="cover-fallback">
                  <div class="record-disc"><div></div></div>
                  <span>DROP A TRACK</span>
                </div>
                <img id="coverImage" alt="当前曲目封面">
              </div>
              <div class="track-info-card">
                <div class="now-playing">
                  <h2 id="trackTitle"><span id="trackTitleText">等待选曲</span></h2>
                  <p id="trackArtist">导入音频或视频开始品味大战</p>
                  <div class="disc-title-line"><span class="mini-disc" aria-hidden="true"></span><strong id="trackTitleRepeat">等待选曲</strong></div>
                </div>
              </div>
              <canvas id="visualizer" aria-label="音频频谱"></canvas>
            </section>

            <section class="interaction-zone">
              <div id="trackSubmitter" class="submitter-name">投稿人待填写</div>

              <div id="descriptionCard" class="description-card" hidden>
                <div id="descriptionScroll" class="description-scroll"></div>
              </div>
            </section>
          </div>
          <section class="tag-zone" aria-label="曲风标签">
            <h3>Tag</h3>
            <div id="trackGenreDisplay" class="tag-content" hidden></div>
          </section>
        </div>

      </section>

      <section class="control-deck control-surface">
        <div class="transport-row">
          <div class="transport-buttons">
            <button id="previousButton" class="round-button" type="button" title="上一首">‹</button>
            <button id="playButton" class="play-button" type="button" title="播放/暂停">▶</button>
            <button id="nextButton" class="round-button" type="button" title="下一首">›</button>
          </div>
          <span id="currentTime">00:00</span>
          <input id="progressInput" class="range-input progress-input" type="range" min="0" max="1000" value="0" aria-label="播放进度">
          <span id="durationTime">00:00</span>
          <span class="volume-label">音量</span>
          <input id="volumeInput" class="range-input volume-input" type="range" min="0" max="1.25" value="0.85" step="0.01" aria-label="音量，最高 125%">
          <span class="opacity-label">视频信息卡底色</span>
          <input id="commentOpacityInput" class="range-input opacity-input" type="range" min="0" max="100" value="72" step="1" aria-label="视频画面信息卡透明度">
          <output id="commentOpacityValue" class="opacity-value">72%</output>
        </div>

      </section>
    </main>
  </div>

  <div id="dropOverlay" class="drop-overlay">
    <div><strong>释放以加入播放队列</strong><span>可一次拖入多个音频或视频文件</span></div>
  </div>

  <dialog id="trackEditDialog" class="settings-dialog track-edit-dialog">
    <form method="dialog">
      <div class="dialog-header">
        <div>
          <span class="eyebrow">TRACK METADATA</span>
          <h2>编辑当前曲目</h2>
        </div>
        <button class="dialog-close" value="cancel" aria-label="关闭">×</button>
      </div>
      <div class="cover-editor">
        <div id="trackCoverPreview" class="track-cover-preview"><span>暂无封面</span></div>
        <div class="cover-editor-actions">
          <strong>曲目封面</strong>
          <p>支持 JPG、PNG、WebP、GIF 和 BMP，建议使用正方形图片。</p>
          <div>
            <button id="chooseCoverButton" class="ghost-button" type="button">选择封面图片</button>
            <button id="clearCoverButton" class="danger-button" type="button">移除封面</button>
          </div>
        </div>
      </div>
      <label class="field-label">
        <span>曲目名称</span>
        <input id="trackTitleInput" maxlength="120" placeholder="显示在节目画面中的曲名">
      </label>
      <label class="field-label">
        <span>作曲</span>
        <input id="trackComposerInput" maxlength="80" placeholder="作曲者姓名（与投稿人分开）">
      </label>
      <label class="field-label">
        <span>投稿人名称</span>
        <input id="trackSubmitterInput" maxlength="80" placeholder="例如：小明 / 乐队名称 / 匿名投稿人">
      </label>
      <label class="field-label">
        <span>曲风</span>
        <input id="trackGenreInput" maxlength="80" placeholder="例如：电子 / 摇滚 / 爵士">
      </label>
      <label class="field-label">
        <span>歌曲简介</span>
        <textarea id="trackDescriptionInput" rows="5" placeholder="介绍创作背景、风格或想让观众注意的细节"></textarea>
      </label>
      <label class="description-toggle">
        <input id="trackDescriptionVisibleInput" type="checkbox">
        <span>在节目画面展示歌曲简介</span>
      </label>
      <div class="dialog-actions">
        <button class="ghost-button" value="cancel">取消</button>
        <button id="saveTrackMetadataButton" class="primary-button" type="button">保存曲目信息</button>
      </div>
    </form>
  </dialog>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="cover-validation.js"></script>
  <script src="app.js"></script>
</body>
</html>
